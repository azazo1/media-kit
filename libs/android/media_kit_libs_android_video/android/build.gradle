import java.io.File
import java.nio.file.Files
import java.security.MessageDigest

group 'com.alexmercerind.media_kit_libs_android_video'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:7.3.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // Conditional for compatibility with AGP <4.2.
    if (project.android.hasProperty("namespace")) {
        namespace 'com.alexmercerind.media_kit_libs_android_video'
    }

    compileSdkVersion 31

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        minSdkVersion 16
    }

    dependencies {
        implementation fileTree(dir: "$buildDir/output", include: "*.jar")
    }
}

task downloadDependencies(type: Exec) {
        // Delete previously created /output subdirectory.

        def outputDir = file("$buildDir/output")
        if (outputDir.exists()) {
            outputDir.deleteDir()
        }
        outputDir.mkdirs()

        // Download all *.jar dependencies & verify against the md5.txt published
        // next to them, so libmpv updates do not require a media_kit change.
        def md5Url = "https://github.com/azazo1/libmpv-android-video-build/releases/download/vnext/md5.txt"
        def md5File = file("$buildDir/vnext/md5.txt")
        md5File.parentFile.mkdirs()
        md5File.withOutputStream { os ->
            os << new URL(md5Url).openStream()
        }
        def md5ByFile = [:]
        md5File.eachLine { line ->
            def parts = line.trim().split(/\s+/)
            if (parts.length == 2) {
                md5ByFile[parts[1].tokenize('/').last()] = parts[0]
            }
        }

        def filesToDownload = [
            ["url": "https://github.com/azazo1/libmpv-android-video-build/releases/download/vnext/default-arm64-v8a.jar", "destination": file("$buildDir/vnext/default-arm64-v8a.jar")],
        ]

        filesToDownload.each { fileInfo ->
            def destFile = fileInfo.destination
            def expectedMD5 = md5ByFile[destFile.name]
            if (expectedMD5 == null) {
                throw new GradleException("MD5 for ${destFile.name} not found in md5.txt")
            }
            if (destFile.exists()) {
                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()

                if (calculatedMD5 != expectedMD5) {
                    destFile.delete()
                    println "MD5 mismatch. File deleted: ${destFile}"
                }

            }

            if (!destFile.exists()) {
                destFile.parentFile.mkdirs()
                println "Downloading file from: ${fileInfo.url}"
                destFile.withOutputStream { os ->
                    os << new URL(fileInfo.url).openStream()
                }

                def calculatedMD5 = MessageDigest.getInstance("MD5").digest(Files.readAllBytes(destFile.toPath())).encodeHex().toString()
                if (calculatedMD5 != expectedMD5) {
                    throw new GradleException("MD5 verification failed for ${destFile}")
                }
            }

            copy {
                from destFile
                into outputDir
            }
        }
}

assemble.dependsOn(downloadDependencies)